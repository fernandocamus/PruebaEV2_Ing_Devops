name: Spring Boot CI Seguro TCG

on:
  push:
    branches:
      - main
      - feature/ep2-devsecops-docker
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Análisis de seguridad de dependencias (SCA) con Snyk
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: tcg/pom.xml

      - name: Permisos de ejecucion a Maven Wrapper
        run: chmod +x mvnw

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk CLI
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Snyk test Java dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

      - name: Generate Snyk JSON Report
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "Generando reporte JSON de Snyk..."
          snyk test -json > snyk-report.json || echo "Snyk encontro vulnerabilidades, pero se continua con el reporte"
          ls -lh snyk-report.json || echo "No se genero el reporte"

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: tcg/snyk-report.json

  # 2. Pruebas unitarias y cobertura con JaCoCo
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    needs: snyk-scan
    defaults:
      run:
        working-directory: tcg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: tcg/pom.xml

      - name: Build and test
        run: ./mvnw clean verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: tcg/target/site/jacoco/

  # 3. Analisis de calidad y seguridad del codigo (SAST) con SonarCloud
  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: tcg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: tcg/pom.xml

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=fernandocamus_PruebaEV2_Ing_Devops \
            -Dsonar.organization=fernandocamus \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

  # 4. Despliegue y verificacion automatizada en entorno simulado con Compose
  deploy-simulated:
    name: Deploy Simulado (Docker Compose)
    runs-on: ubuntu-latest
    needs: sonar-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: |
          docker compose up -d --build

      - name: Esperar inicializacion de los contenedores
        run: |
          sleep 25

      - name: Verificar estado y salud de los contenedores
        run: |
          docker compose ps
          docker compose logs tcg-service